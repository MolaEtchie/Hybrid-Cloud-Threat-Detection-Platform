# ============================================================================
# Kibana Configuration
# Hybrid Cloud Threat Detection & Malware Analysis Platform
#
# Simplified configuration used for this project.
# Sensitive credentials, certificates and tokens have been removed.
# ============================================================================

server.port: 5601
server.host: "0.0.0.0"

elasticsearch.hosts:
  - "https://localhost:9200"

logging.appenders.file.type: file
logging.appenders.file.fileName: /var/log/kibana/kibana.log
logging.appenders.file.layout.type: json

logging.root.appenders:
  - default
  - file

pid.file: /run/kibana/kibana.pid

# Placeholder encryption key
xpack.encryptedSavedObjects.encryptionKey: "YOUR_32_BYTE_ENCRYPTION_KEY"
