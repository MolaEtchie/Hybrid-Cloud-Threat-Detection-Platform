# ============================================================================
# Logstash Pipeline Configuration
# Hybrid Cloud Threat Detection & Malware Analysis Platform
#
# Purpose:
# This pipeline was developed during the initial phase of the project to
# receive logs from Filebeat, process them and forward them to Elasticsearch.
#
# During the final implementation, Filebeat was reconfigured to send data
# directly to Elasticsearch because the virtual machine (4 GB RAM) could not
# reliably run Elasticsearch, Kibana, Logstash, Suricata and Zeek together.
# Logstash remains included here to document the original pipeline design.
# ============================================================================

input {
  beats {
    port => 5044
  }
}

filter {

  # Parse Linux syslog messages
  if [message] {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host} %{DATA:program}: %{GREEDYDATA:log_message}"
      }
    }
  }

  # Tag Suricata events
  if [event][module] == "suricata" {
    mutate {
      add_tag => ["suricata"]
    }
  }
}

output {

  elasticsearch {
    hosts => ["https://localhost:9200"]

    user => "elastic"
    password => "YOUR_ES_PASSWORD"

    ssl_enabled => true
    ssl_verification_mode => "none"

    index => "filebeat-%{+YYYY.MM.dd}"
  }

  # Display events in the terminal during testing
  stdout {
    codec => rubydebug
  }
}
