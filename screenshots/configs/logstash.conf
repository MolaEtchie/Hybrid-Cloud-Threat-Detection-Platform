# Original pipeline for Linux system logs

input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host} %{DATA:program}: %{GREEDYDATA:log_message}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "<ELASTIC_PASSWORD>"
    ssl_enabled => true
    ssl_verification_mode => "none"
    index => "linux-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}

# Pipeline later used for Filebeat/Suricata events

input {
  beats {
    port => 5044
  }
}

filter {
  if [event][module] == "suricata" {
    mutate {
      add_tag => ["suricata"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "<ELASTIC_PASSWORD>"
    ssl_enabled => true
    ssl_verification_mode => "none"
    index => "filebeat-%{+YYYY.MM.dd}"
  }
}
